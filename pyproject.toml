[project]
name = "tiny-learners-media"
version = "0.1.0"
description = "Post large, high-quality videos to YouTube and TikTok from Windows, driven by Claude over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
tlm = "tlmedia.cli:main"

[project.gui-scripts]
# Same CLI without a console window, for the Windows scheduled task.
tlmw = "tlmedia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlmedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
